version: 1
name: playback-fixture-search
browser:
  chrome: chrome-for-testing@pinned
  profile: ephemeral
  initial_url: http://127.0.0.1:8080/index.html
  window:
    bounds: { left: 1200, top: 80, width: 900, height: 700 }
    content: { width: 860, height: 560 }
  display:
    expected_dpr: 1
    browser_zoom: 100
    zoom_check: strict
playback:
  seed: "42"
  jitter:
    enabled: false
    distribution: none
    radius_px: 0
    min_distance_from_edge_px: 0
    out_of_bounds: fail
steps:
  - do: click
    at: { x: 92, y: 28 }
  - do: text
    value: crer
  - do: click
    at: { x: 270, y: 28 }
  - do: screenshot
    name: result
