version: 1
name: playback-fixture-drag
browser:
  chrome: chrome-for-testing@pinned
  profile: ephemeral
  initial_url: http://127.0.0.1:8080/index.html
  window:
    bounds: { left: 1200, top: 80, width: 900, height: 700 }
    content: { width: 860, height: 560 }
  display:
    expected_dpr: 1
    browser_zoom: 100
    zoom_check: strict
playback:
  seed: "42"
  jitter:
    enabled: false
    distribution: none
    radius_px: 0
    min_distance_from_edge_px: 0
    out_of_bounds: fail
steps:
  - do: wait_for
    state: complete
    locator_hint: { role: slider, name: Drag handle }
  - do: drag
    from: { x: 56, y: 100 }
    to: { x: 300, y: 100 }
  - do: assert
    state: complete
    locator_hint: { role: status, name: Drag Result, text: "264" }
  - do: screenshot
    name: result
